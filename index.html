<!doctype html>
<html lang="en">
    <head>
        <title>Title</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="src/styles/main.scss" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
            integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
    </head>

    <body>
        <!-- Header -->
        <header class="header container">
            <div class="header__logo-wrapper">
                <div class="header__logo">
                    <img
                        src="./public/assets/images/logo.svg"
                        alt="logo image"
                    />
                </div>
            </div>
            <div class="header__nav-overlay"></div>

            <nav
                class="header__nav"
                id="main-navigation"
                aria-label="Main navigation"
            >
                <div class="header__menu-wrapper">
                    <button
                        class="header__nav-close-btn"
                        aria-label="Close navigation menu"
                        aria-expanded="true"
                        aria-controls="main-navigation"
                    >
                        <img
                            src="./assets/images/icons/close.svg"
                            alt=""
                            aria-hidden="true"
                        />
                    </button>
                </div>
                <a href="#hero" class="header__nav-link">Home</a>
                <a href="#" class="header__nav-link">Discover</a>
                <a href="#" class="header__nav-link">Special Deals</a>
                <a href="#" class="header__nav-link">Contact</a>
            </nav>

            <button
                class="header__menu"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="main-navigation"
            >
                <span class="header__menu-line header__menu-line--1"></span>
                <span class="header__menu-line header__menu-line--2"></span>
                <span class="header__menu-line header__menu-line--3"></span>
            </button>

            <div class="header__cta hidden md:block">
                <button class="btn btn--ghost">Log in</button>
                <button class="btn btn--primary">Sign up</button>
            </div>
        </header>

        <main>
            <!-- Hero -->
        </main>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
