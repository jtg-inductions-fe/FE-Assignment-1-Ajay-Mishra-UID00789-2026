<!doctype html>
<html lang="en">
    <head>
        <title>Title</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="src/styles/main.scss" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
            integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
    </head>

    <body>
        <!-- Header -->
        <header class="header">
            <div class="header__container">
                <div class="header__decoration" aria-hidden="true"></div>
                <div class="header__logo-wrapper">
                    <a
                        href="/"
                        class="header__logo"
                        aria-label="Go to home page"
                    >
                        <img src="/assets/images/logo.svg" alt="Travlog" />
                    </a>
                </div>
                <div class="header__nav-overlay" aria-hidden="true"></div>

                <nav
                    class="header__nav"
                    id="main-navigation"
                    aria-label="Main navigation"
                >
                    <div class="header__menu-wrapper">
                        <button
                            class="header__nav-close-btn"
                            aria-label="Close navigation menu"
                            aria-expanded="true"
                            aria-controls="main-navigation"
                        >
                            <img
                                src="./assets/images/icons/close.svg"
                                alt=""
                                aria-hidden="true"
                            />
                        </button>
                    </div>
                    <a href="#hero" class="header__nav-link">Home</a>
                    <a href="#" class="header__nav-link">Discover</a>
                    <a href="#" class="header__nav-link">Special Deals</a>
                    <a href="#" class="header__nav-link">Contact</a>
                </nav>

                <button
                    class="header__menu"
                    type="button"
                    aria-label="Open navigation menu"
                    aria-expanded="false"
                    aria-controls="main-navigation"
                >
                    <span class="header__menu-line header__menu-line--1"></span>
                    <span class="header__menu-line header__menu-line--2"></span>
                    <span class="header__menu-line header__menu-line--3"></span>
                </button>

                <div class="header__cta">
                    <button class="btn btn--ghost">Log in</button>
                    <button class="btn btn--primary">Sign up</button>
                </div>
            </div>
        </header>

        <main>
            <!-- Hero -->
            <section class="hero">
                <div class="hero__container">
                    <img
                        src="assets/images/triangles.svg"
                        class="hero__triangles"
                        aria-hidden="true"
                    />
                    <div class="hero__media">
                        <picture>
                            <source
                                srcset="assets/images/hero-desktop.webp"
                                media="(min-width: 430px)"
                            />

                            <img
                                src="assets/images/hero-mobile.webp"
                                alt="Travel destination"
                            />
                        </picture>
                    </div>

                    <div class="hero__content">
                        <div class="hero__tag btn">
                            <span>Explore the world!</span>
                            <i
                                class="color-secondary fa-solid fa-briefcase"
                                aria-hidden="true"
                            ></i>
                        </div>

                        <h1 class="hero__title heading-1">
                            Travel <span>top destination</span> of the world
                        </h1>

                        <p class="hero__description">
                            We always make our customer happy by
                            <span>providing</span> as many choices as possible
                        </p>

                        <div class="hero__actions">
                            <button type="button" class="btn btn--primary">
                                Get Started
                            </button>

                            <button type="button" class="btn btn--outline">
                                <i
                                    class="btn__icon fa-solid fa-circle-play"
                                    aria-hidden="true"
                                ></i>
                                <span>Watch Demo</span>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Brands -->
            <section class="brands">
                <div class="container brands__container">
                    <ul class="brands-list">
                        <li class="brands-list__item">
                            <img
                                src="assets/images/brand-1.svg"
                                alt="Tripadvisor"
                            />
                        </li>

                        <li class="brands-list__item">
                            <img
                                src="assets/images/brand-2.svg"
                                alt="Expedia"
                            />
                        </li>

                        <li class="brands-list__item">
                            <img
                                src="assets/images/brand-3.svg"
                                alt="Booking.com"
                            />
                        </li>

                        <li class="brands-list__item">
                            <img src="assets/images/brand-4.svg" alt="Airbnb" />
                        </li>

                        <li class="brands-list__item">
                            <img src="assets/images/brand-5.svg" alt="Orbitz" />
                        </li>
                    </ul>
                </div>
            </section>
            <section class="travel-point"></section>
        </main>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
